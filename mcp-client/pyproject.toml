[project]
name = "mcp-client"
version = "0.1.0"
description = "MCP Client with AI Agent for connecting to MCP servers"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.22.0",
    "openai>=2.8.1",
    "python-dotenv>=1.2.1",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=3.0.0,<4",
    "langmem>=0.0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_agent"]
