name: api-server CI

on:
  pull_request:
    paths:
      - "api-server/**"
      - "mcp-client/**"
      - ".github/workflows/api-server-ci.yml"
  push:
    branches: [main]
    paths:
      - "api-server/**"
      - "mcp-client/**"
      - ".github/workflows/api-server-ci.yml"

jobs:
  docker-build:
    name: Build api-server Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api-server/Dockerfile
          push: false
          tags: dbeelight-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
