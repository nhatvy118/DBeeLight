# Backend stack — postgres, redis, api-server.
# The frontend is deployed separately (not part of this compose).
#
# Usage:
#   1. cp api-server/.env.example api-server/.env  (fill OPENAI_API_KEY, GOOGLE_*, SESSION_SECRET)
#   2. docker compose up --build
#   3. API at http://localhost:5001
#
# Migrations: docker compose exec api-server make migrate-up
#
# In production (EC2): DB_URL points at RDS, REDIS_URL may point at ElastiCache,
# uploads should go to S3 — override via .env, not by editing this file.

x-common: &common
  logging:
    options:
      max-size: 50m
      max-file: "3"
  restart: unless-stopped

services:
  postgres:
    <<: *common
    image: pgvector/pgvector:pg17
    container_name: dbeelight-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbeelight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: ${POSTGRES_DB:-dbeelight_app}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *common
    image: redis:7-alpine
    container_name: dbeelight-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-server:
    <<: *common
    image: ghcr.io/nhatvy118/dbeelight-api:${API_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: api-server/Dockerfile
    container_name: dbeelight-api
    env_file:
      - ./api-server/.env
    environment:
      DB_URL: postgres://${POSTGRES_USER:-dbeelight}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dbeelight_app}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api-server/internal/file_handle:/app/api-server/internal/file_handle
      - ./api-server/internal/temp_dbs:/app/api-server/internal/temp_dbs
      - ./api-server/internal/databases:/app/api-server/internal/databases

volumes:
  postgres_data:
  redis_data:
