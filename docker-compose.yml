# Docker Compose for mcp-server
# Usage: docker compose up -d

x-common: &common
  logging:
    options:
      max-size: 50m
      max-file: "3"
  restart: unless-stopped

services:
  # Redis for mcp-server sessions
  redis:
    <<: *common
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Superset Redis (dedicated)
  superset-redis:
    <<: *common
    image: redis:7-alpine
    container_name: superset-redis
    ports:
      - "6378:6379"
    volumes:
      - superset_redis_data:/data
    command: redis-server --requirepass redis_pass_123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_pass_123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Superset initialization (runs once, then exits)
  superset-init:
    <<: *common
    image: apache/superset:latest
    user: root
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    environment:
      DATABASE_DIALECT: postgresql+psycopg2
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_HOST: ${POSTGRES_HOST:-host.docker.internal}
      DATABASE_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_DB: ${SUPERSET_DB:-superset}
      REDIS_HOST: superset-redis
      REDIS_PORT: 6379
      REDIS_CELERY_DB: 0
      REDIS_RESULTS_DB: 1
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-CHANGE-THIS-IN-PRODUCTION}
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@localhost}
      ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME:-Admin}
      ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME:-User}
    command: >
      bash -c "
      echo 'Installing PostgreSQL driver...' &&
      python -m ensurepip --upgrade &&
      /app/.venv/bin/pip3 install psycopg2-binary &&
      echo 'Waiting for database...' &&
      superset db upgrade &&
      superset fab create-admin --username $${ADMIN_USERNAME} --email $${ADMIN_EMAIL} --password $${ADMIN_PASSWORD} --firstname $${ADMIN_FIRSTNAME} --lastname $${ADMIN_LASTNAME} --findquiet ||
      echo 'Admin user may already exist' &&
      superset init &&
      echo 'Superset initialization complete!'
      "
    restart: "no"
    depends_on:
      superset-redis:
        condition: service_healthy

  # Superset main application
  superset:
    <<: *common
    image: apache/superset:latest
    user: root
    ports:
      - "8088:8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./api-server/databases:/app/databases:ro
    entrypoint: >
      bash -c "
      /app/.venv/bin/python -m ensurepip --upgrade &&
      /app/.venv/bin/pip3 install --no-cache-dir psycopg2-binary &&
      exec /app/docker/entrypoints/run-server.sh
      "
    environment:
      DATABASE_DIALECT: postgresql+psycopg2
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_HOST: ${POSTGRES_HOST:-host.docker.internal}
      DATABASE_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_DB: ${SUPERSET_DB:-superset}
      REDIS_HOST: superset-redis
      REDIS_PORT: 6379
      REDIS_CELERY_DB: 0
      REDIS_RESULTS_DB: 1
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-CHANGE-THIS-IN-PRODUCTION}
    depends_on:
      superset-init:
        condition: service_completed_successfully
      superset-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Superset Celery worker
  superset-worker:
    <<: *common
    image: apache/superset:latest
    user: root
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./api-server/databases:/app/databases:ro
    entrypoint: >
      bash -c "
      /app/.venv/bin/python -m ensurepip --upgrade &&
      /app/.venv/bin/pip3 install --no-cache-dir psycopg2-binary &&
      exec celery --app=superset.tasks.celery_app:app worker -O fair -l INFO --concurrency=2
      "
    environment:
      DATABASE_DIALECT: postgresql+psycopg2
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_HOST: ${POSTGRES_HOST:-host.docker.internal}
      DATABASE_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_DB: ${SUPERSET_DB:-superset}
      REDIS_HOST: superset-redis
      REDIS_PORT: 6379
      REDIS_CELERY_DB: 0
      REDIS_RESULTS_DB: 1
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-CHANGE-THIS-IN-PRODUCTION}
    depends_on:
      superset-init:
        condition: service_completed_successfully
      superset-redis:
        condition: service_healthy

  # Superset Celery beat scheduler
  superset-worker-beat:
    <<: *common
    image: apache/superset:latest
    user: root
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    entrypoint: >
      bash -c "
      /app/.venv/bin/python -m ensurepip --upgrade &&
      /app/.venv/bin/pip3 install --no-cache-dir psycopg2-binary &&
      exec celery --app=superset.tasks.celery_app:app beat --pidfile /tmp/celerybeat.pid -l INFO -s /tmp/celerybeat-schedule
      "
    environment:
      DATABASE_DIALECT: postgresql+psycopg2
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_HOST: ${POSTGRES_HOST:-host.docker.internal}
      DATABASE_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_DB: ${SUPERSET_DB:-superset}
      REDIS_HOST: superset-redis
      REDIS_PORT: 6379
      REDIS_CELERY_DB: 0
      REDIS_RESULTS_DB: 1
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-CHANGE-THIS-IN-PRODUCTION}
    depends_on:
      superset-worker:
        condition: service_started
      superset-redis:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  redis_data:
  superset_redis_data:
