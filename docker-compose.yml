# Docker Compose for mcp-server
# Usage: docker compose up -d

x-common: &common
  logging:
    options:
      max-size: 50m
      max-file: "3"
  restart: unless-stopped

services:
  # Redis for mcp-server sessions
  redis:
    <<: *common
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
