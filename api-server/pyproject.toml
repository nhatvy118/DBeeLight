[project]
name = "api-server"
version = "0.1.0"
description = "FastAPI server for MCP Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
    "itsdangerous>=2.1.2",
    "asyncpg>=0.29.0",
    "mcp>=1.22.0",
    "openai>=2.8.1",
    "mcp-client",
]
scripts = { api-server = "internal:main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["internal"]

[tool.uv.sources]
mcp-client = { path = "../mcp-client", editable = true }

