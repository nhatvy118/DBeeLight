[project]
name = "api-server"
version = "0.1.0"
description = "Flask API server for MCP Agent"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.22.0",
    "openai>=2.8.1",
]
scripts = { api-server = "api_server:main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api_server"]

