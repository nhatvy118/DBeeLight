[project]
name = "dbeelight-backend"
version = "0.1.0"
description = "DBeeLight backend — in-process agent tools (database/chart) + Excel MCP over HTTP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "openai>=1.40",
    "langgraph>=0.2.20",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3",
    "sqlglot>=25.0",
    "psycopg[binary,pool]>=3.1",
    "sqlalchemy[asyncio]>=2.0",
    "greenlet>=3.0",
    "aiosqlite>=0.20",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "mcp>=1.22.0",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
