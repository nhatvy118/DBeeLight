readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.10.1",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.30.0",
    "asyncpg>=0.29.0",
    "cryptography>=42.0.0",
]
