server {
    listen 80;
    server_name _;

    # Frontend SPA — static build from Vite.
    root /usr/share/nginx/html;
    index index.html;

    # Long-lived hashed assets — cache aggressively.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy → api-server container.
    # In docker-compose the upstream hostname is the service name `api-server`.
    location /api/ {
        proxy_pass http://api-server:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LangGraph workflows with HITL can run for minutes; SSE/streaming must not buffer.
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Allow Excel/PDF uploads.
        client_max_body_size 50M;
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
