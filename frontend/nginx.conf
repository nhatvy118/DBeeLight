server {
    listen 80;
    server_name _;

    # Frontend SPA — static build from Vite.
    root /usr/share/nginx/html;
    index index.html;

    # Long-lived hashed assets — cache aggressively.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy → backend container.
    # In docker-compose the upstream hostname is the service name `backend`.
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LangGraph workflows with HITL can run for minutes; SSE/streaming must not buffer.
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Allow large data uploads (backend caps at 200 MiB for streamed DB imports;
        # 210M leaves headroom for multipart framing). NOTE: if a separate proxy sits
        # in front of api.* in production, raise its limit too — nginx 413 responses
        # carry no CORS headers, so the browser reports them as CORS errors.
        client_max_body_size 210M;

        # Big uploads shouldn't be buffered to nginx disk before reaching the app —
        # the backend already streams the body to a temp file itself.
        proxy_request_buffering off;
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
