[project]
name = "superset-mcp"
version = "0.1.0"
description = "Superset MCP server for chart and dashboard visualization"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pdm.scripts]
start = "python main.py"
dev = "python -m mcp dev superset_tools.py"
inspect = "python -m mcp inspect"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
